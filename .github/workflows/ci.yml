name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Builds never call TMDB (pages that need data render per request), so a placeholder is enough.
  # It also gives the bundle check a concrete value to search the client output for.
  TMDB_API_KEY: ci-placeholder-0123456789abcdef0123
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Typecheck, lint, format, knip, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/setup-ui

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: No TMDB credential in the client bundle
        run: npm run check:bundle

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/setup-ui

      - run: npx playwright install --with-deps chromium

      - name: Playwright against a mock TMDB
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  performance:
    name: Performance budget
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/setup-ui

      - name: Build
        run: npm run build

      - name: Lighthouse mobile against a mock TMDB (score 0.9, CLS 0.1, script budget)
        run: npm run perf:budget

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
