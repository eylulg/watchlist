<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Streaming catalogue: browse trending, top rated and popular movies and series from TMDB." />
        <meta name="theme-color" content="#0c111d" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="preconnect" href="https://image.tmdb.org" />
        <title>Streaming catalogue</title>
        <script>
            // Apply the saved theme before first paint to avoid a flash of the wrong theme.
            try {
                var t = localStorage.getItem("ui-theme");
                if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                    document.documentElement.classList.add("dark-mode");
                }
            } catch (e) {}
        </script>
    </head>
    <body class="bg-primary">
        <noscript>Streaming catalogue needs JavaScript to run.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
